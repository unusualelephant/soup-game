     <link rel="icon" type="image/x-icon" href="fire1_image.png">
    <style>
    </style>
    <script>
        let customer = { // initializing the customer object with a name, image, and an empty order array that will be filled with the three random ingredients that the customer wants
            name: 'Customer',
            image: 'customer.png',
            order: []
        };
        images = ['dryad.png','harpy.png','gnome.png','mermaid.png','unicorn.png','fairy.png'];
        names = ['Dryad', 'Harpy', 'Gnome', 'Mermaid', 'Unicorn', 'Fairy'];
        rndcustomer = Math.floor(Math.random() * images.length);
        customer.image = images[rndcustomer]; // assign a random character image to the customer
        customer.name = names[rndcustomer]; // assign a random character name to the customer, the name and image will always match because they are in the same order in their respective arrays

        let ingredients = ['apple', 'lemon', 'avocado', 'orange', 'banana', 'pineapple', 'kiwi', 'strawberry', 'pepper', 'carrot', 'tomato', 'potato', 'mushroom', 'broccoli', 'lettuce', 'cucumber'];
        let rnding, ing1, ing2, ing3; // random ingredient index and the three ingredients that the customer wants
        for (let i = 0; i < 3; i++){
        rnding = Math.floor(Math.random() * ingredients.length);
        switch (rnding){
            case 0:
                console.log(ingredients[0]);
                break;
            case 1:
                console.log(ingredients[1]);
                break;
            case 2:
                console.log(ingredients[2]);
                break;
            case 3:
                console.log(ingredients[3]);
                break;
            case 4:
                console.log(ingredients[4]);
                break;
            case 5:
                console.log(ingredients[5]);
                break;
            case 6:
                console.log(ingredients[6]);
                break;
            case 7:
                console.log(ingredients[7]);
                break;
            case 8:
                console.log(ingredients[8]);
                break;
            case 9:
                console.log(ingredients[9]);
                break;
            case 10:
                console.log(ingredients[10]);
                break;
            case 11:
                console.log(ingredients[11]);
                break;
            case 12:
                console.log(ingredients[12]);
                break;
            case 13:
                console.log(ingredients[13]);
                break;
            case 14:
                console.log(ingredients[14]);
                break;
            case 15:
                console.log(ingredients[15]);
                break;
            default:
                console.log('Error: Invalid ingredient index');
            }
            if (i == 0){
                ing1 = ingredients[rnding]; // assign the first ingredient to ing1
            } else if (i == 1){
                ing2 = ingredients[rnding]; // assign the second ingredient to ing2
            } else if (i == 2){
                ing3 = ingredients[rnding]; // assign the third ingredient to ing3, all three will be used later to compare ingredients used by the player to the customer order
            }
        }  
        console.log(ing1, ing2, ing3);
        customer.order.push(ing1, ing2, ing3); // add the three random ingredients to the customer's order array
        
        window.addEventListener('DOMContentLoaded', function() {
            let customer_image = document.getElementById('customer-image');
            let customer_name = document.getElementById('customer-name');
            let customer_order = document.getElementById('customer-order');
            customer_image.src = customer.image;
            customer_name.textContent = customer.name;
            customer_order.textContent = 'Order: ' + customer.order.join(', ');
        });
    </script>
