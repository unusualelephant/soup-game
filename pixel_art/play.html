        rnding = Math.floor(Math.random() * ingredients.length);
        switch (rnding){

                console.log('Error: Invalid ingredient index');
        }
        if (i == 0){
            ing1 = ingredients[rnding]; // assign the first ingredient to ing1
        } else if (i == 1){
            ing2 = ingredients[rnding]; // assign the second ingredient to ing2
        } else if (i == 2){
